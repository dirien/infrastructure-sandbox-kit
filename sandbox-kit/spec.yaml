schemaVersion: "2"
kind: sandbox
name: infrastructure-sandbox
displayName: Infrastructure (IaC) Sandbox for Claude Code
description: >-
  The one-artifact form of infrastructure-sandbox-kit: a `kind: sandbox` kit
  that names the prebuilt template image and carries the network allow-list,
  the Pulumi credential, environment, setup steps and agent instructions, so
  a single `--kit` flag brings up the whole IaC workstation. The sibling
  `kit/` mixin declares the same behavior for layering onto the stock
  `claude` agent (zero build).
version: "0.7.0"

# The declarative blocks below mirror kit/spec.yaml (the mixin). When you
# change one, change both. The only intended differences are this header,
# `kind`, `name`, the `sandbox:` block, and the missing mixin-only `requires`.
sandbox:
  # The prebuilt multi-arch template (linux/amd64 + linux/arm64) with the IaC
  # toolchain baked in; see template/. The image pins its own tool versions,
  # so this kit's install step is a fast sentinel no-op.
  image: ghcr.io/dirien/infrastructure-sandbox:v0.7.0

# Egress allow-list. The kit ships what its own provisioning and the core IaC
# flow need; add your cloud/region endpoints (see docs/network.md). Kit-level
# enforcement covers exact hosts, host:port and single-label *.host patterns;
# **.host and CIDR parse but are not enforced yet (docs/network.md).
permissions:
  network:
    allow:
      # Pulumi: service/state API, CLI+plugin downloads, hosted MCP
      - api.pulumi.com
      - get.pulumi.com
      - mcp.ai.pulumi.com
      # Terraform + OpenTofu: CLI downloads + provider registries
      - releases.hashicorp.com
      - registry.terraform.io
      - registry.opentofu.org
      - get.opentofu.org
      # Kubernetes: kubectl (dl.k8s.io redirects to its CDN) + Helm downloads
      - dl.k8s.io
      - cdn.dl.k8s.io
      - get.helm.sh
      # Cloud CLIs: installer downloads + GPG-signed apt repos
      - awscli.amazonaws.com
      - packages.microsoft.com
      - packages.cloud.google.com
      - dl.google.com
      # OS packages: the base image's apt sources (Ubuntu + pre-added Docker
      # repo, GPG-signed), so a plain `apt-get update && apt-get install`
      # works in the sandbox. ports.ubuntu.com serves the arm64 packages.
      - archive.ubuntu.com
      - security.ubuntu.com
      - ports.ubuntu.com
      - download.docker.com
      # GitHub: Pulumi/OpenTofu binaries, provider plugins, gh, the APM CLI
      # release tarballs and the APM skill repos
      - github.com
      - api.github.com
      - codeload.github.com
      - raw.githubusercontent.com
      - objects.githubusercontent.com
      - release-assets.githubusercontent.com
      # Language package registries (your IaC program + provisioning)
      - registry.npmjs.org
      - pypi.org
      - files.pythonhosted.org
      - proxy.golang.org
      - sum.golang.org
      - storage.googleapis.com
      # Cloud control-plane starters (extend per provider/region; docs/network.md)
      - sts.amazonaws.com
      - management.azure.com
      - login.microsoftonline.com
      - graph.microsoft.com
      - accounts.google.com
      - oauth2.googleapis.com
      - "*.googleapis.com"
      # Optional .NET (uncomment together with ISK_INSTALL_DOTNET=1 below)
      # - dot.net
      # - builds.dotnet.microsoft.com
      # - api.nuget.org
      # - "*.nuget.org"

# Pulumi Cloud token. A v2 kit only declares the credential; the value is bound
# on the host:  printf '%s\n' "$PULUMI_ACCESS_TOKEN" | sbx secret set -g pulumi
# The proxy injects `Authorization: token <PAT>` on api.pulumi.com; inside the
# container PULUMI_ACCESS_TOKEN only ever holds the proxy-managed placeholder.
credentials:
  - service: pulumi
    description: "Pulumi Cloud access token (pulumi login/up + ESC via pulumi env)"
    required: false
    apiKey:
      name: PULUMI_ACCESS_TOKEN
      proxyManaged: true
      inject:
        - domain: api.pulumi.com
          header: Authorization
          format: "token %s"

environment:
  variables:
    PULUMI_SKIP_UPDATE_CHECK: "true"
    AWS_PAGER: ""
    CLOUDSDK_CORE_DISABLE_PROMPTS: "1"

setup:
  install:
    # Runs once at create (sh -c), before Claude launches, as the agent user.
    # On the template image above this is a fast sentinel no-op; the fetch path
    # exists so the kit also converges on an image that lacks the tools.
    - user: "1000"
      description: "Install the IaC toolchain (Pulumi/Terraform/OpenTofu + AWS/Azure/gcloud) and wire dirien/my-claude-apm-setup into the agent home"
      command: |
        set -eu
        # --- pins (edit to taste) ---
        export ISK_PULUMI_VERSION="3.255.0"
        export ISK_TERRAFORM_VERSION="1.15.8"
        export ISK_OPENTOFU_VERSION="1.12.5"
        export ISK_KUBECTL_VERSION="1.36.3"
        export ISK_HELM_VERSION="4.2.3"
        export ISK_AWSCLI_VERSION="2.36.10"
        export ISK_AZ_APT_DIST="noble"       # Microsoft azure-cli repo dist (no 'resolute'/26.04 yet)
        export ISK_INSTALL_CLOUDS="1"        # set to "0" to skip AWS/Azure/gcloud (faster create)
        export ISK_APM_SETUP_REPO="dirien/my-claude-apm-setup"
        export ISK_APM_SETUP_REF="v0.6.2"
        export ISK_APM_VERSION="0.28.0"     # apm CLI, pinned + SHA256-verified (bump deliberately)
        export ISK_INSTALL_DOTNET="0"        # set to "1" for Pulumi C#/.NET (also uncomment the .NET domains above)
        KIT_REPO="dirien/infrastructure-sandbox-kit"
        # Immutable ref the provisioning scripts are fetched from (reproducible). A
        # released tag/SHA — NOT a moving branch. `sbx kit push` rewrites this to the
        # exact commit SHA when publishing to OCI (see scripts/push-kit.sh).
        KIT_REF="v0.7.0"
        # --- locate the provisioning scripts: baked image first, else fetch to a stable home path ---
        DIR="$HOME/.local/share/infrastructure-sandbox-kit/scripts"
        if [ ! -f "$DIR/provision.sh" ]; then
          mkdir -p "$DIR"
          for s in lib.sh install-pulumi.sh install-iac.sh install-clouds.sh install-toolchains.sh setup-apm-home.sh apply-agent-config.sh startup.sh provision.sh; do
            curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --retry-delay 2 \
              -o "$DIR/$s" "https://raw.githubusercontent.com/$KIT_REPO/$KIT_REF/scripts/$s"
          done
        fi
        bash "$DIR/provision.sh"
  startup:
    # Runs on EVERY sandbox start (argv form — startup commands are not
    # shell-interpreted in v2). Docker reseeds ~/.claude/settings.json and
    # ~/.claude.json at create time, so this re-applies the guardrail hooks + MCP
    # servers (idempotent) and retries any cloud CLI that didn't install at
    # create time. Both steps are idempotent and non-fatal. No-op if the scripts
    # aren't present.
    - user: "1000"
      description: "Re-apply APM hooks + MCP and retry any missing cloud CLI (idempotent)"
      command:
        - bash
        - -lc
        - |
          f="$HOME/.local/share/infrastructure-sandbox-kit/scripts/startup.sh"
          [ -f "$f" ] && bash "$f" || true

# For a sandbox kit, the content inlines into the agent profile file.
agentInstructions:
  filename: CLAUDE.md
  content: |
    # Infrastructure-as-Code workstation

    This sandbox is set up for IaC work across Pulumi, Terraform and OpenTofu, with
    the major cloud CLIs.

    Tools on PATH:
    - `pulumi` — `PULUMI_ACCESS_TOKEN` is proxy-managed, so `pulumi login`, `pulumi up`
      and `pulumi env` (Pulumi ESC; the standalone `esc` CLI was retired in 2026) work
      without a token ever entering the container.
    - `terraform` and `tofu` (OpenTofu) — drop-in HCL engines.
    - `kubectl` and `helm` — the Kubernetes CLI and package manager. Cluster
      endpoints are NOT in the egress allow-list; add yours (see docs/network.md).
    - `aws`, `az`, `gcloud` — cloud CLIs (installed unless the kit was built/run
      with ISK_INSTALL_CLOUDS=0).
    - Language runtimes Go, Node.js, Python (plus Java; .NET when enabled) with
      language servers gopls, typescript-language-server, pyright (+ csharp-ls).
    - MCP: `pulumi` (registry lookups, resource-schema and code validation, Pulumi
      Neo), at user scope.
    - Skills, subagents and guardrail hooks from `dirien/my-claude-apm-setup` are
      active globally — a PreToolUse guard blocks destructive shell commands and a
      PostToolUse hook scans edits for secrets and formats them.

    Workflow tips:
    - Pulumi: `pulumi preview` before `pulumi up`; non-interactive runs want
      `--non-interactive` and an explicit `--stack <name>`.
    - Terraform/OpenTofu: `terraform init && terraform plan` (or `tofu ...`);
      providers download from registry.terraform.io / registry.opentofu.org.
    - Cloud auth is NOT baked in. `aws`/`az`/`gcloud` need credentials supplied at
      run time or via Pulumi ESC — see docs/credentials.md. AWS uses SigV4, so its
      credentials live in the container, bounded by the network allow-list.
    - If a provider plugin or a cloud/region endpoint is blocked, add its host to
      the kit's `permissions.network.allow` (see docs/network.md) and recreate.
    - Never hardcode cloud or Pulumi credentials in code — the secret scanner blocks
      the write. Use ESC / stack config / environment.
