name: Build template image

# Build the baked template image and push it to GHCR. This image is large
# (~6.6 GB with the cloud CLIs), so it only runs on version tags or on demand —
# not on every push. Defaults to linux/amd64; set platforms to
# "linux/amd64,linux/arm64" for a multi-arch build (slower: arm64 runs under
# QEMU). Building locally with `make build push` is often the better option.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Build platforms"
        required: false
        default: "linux/amd64"
      install_clouds:
        description: "Install AWS/Azure/gcloud CLIs (1/0)"
        required: false
        default: "1"

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image ref
        id: ref
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          tag="${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}"
          echo "image=ghcr.io/${owner}/infrastructure-sandbox:${tag}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: template/Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          build-args: |
            ISK_INSTALL_CLOUDS=${{ inputs.install_clouds || '1' }}
          tags: ${{ steps.ref.outputs.image }}
          push: true
