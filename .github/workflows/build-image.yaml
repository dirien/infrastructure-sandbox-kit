name: Build template image

# Build the baked template image and push it to GHCR. This image is large
# (~6.6 GB with the cloud CLIs), so it only runs on version tags or on demand —
# not on every push. Each platform builds NATIVELY in a parallel matrix job
# (amd64 on ubuntu-24.04, arm64 on ubuntu-24.04-arm), pushed by digest; a merge
# job then stitches one multi-arch manifest. This keeps wall time near the
# slower single leg (~10 min) instead of the ~1 h a QEMU-emulated arm64 leg
# costs. Building locally with `make build push` also works.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      install_clouds:
        description: "Install AWS/Azure/gcloud CLIs (1/0)"
        required: false
        default: "1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: img
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/infrastructure-sandbox" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: template/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            ISK_INSTALL_CLOUDS=${{ inputs.install_clouds || '1' }}
          outputs: type=image,name=${{ steps.img.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          img="ghcr.io/${owner}/infrastructure-sandbox"
          # On a version tag push, stamp both :vX.Y.Z and :latest. Otherwise :latest only.
          tags=(-t "${img}:latest")
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tags+=(-t "${img}:${{ github.ref_name }}")
          fi
          cd /tmp/digests
          # shellcheck disable=SC2046  # digest list is intentionally word-split
          docker buildx imagetools create "${tags[@]}" $(printf "${img}@sha256:%s " *)
          docker buildx imagetools inspect "${img}:latest"
