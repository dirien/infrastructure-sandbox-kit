name: Publish kit

# Publish both kits to GitHub Container Registry whenever they change on main
# (as :latest) and on version tags (as :vX.Y.Z). The built-in GITHUB_TOKEN can
# push packages, so no extra secret is needed.
#   * kit/         kit-spec v3 mixin -> ghcr.io/<owner>/infrastructure-kit
#                  (OCI image built by the docker/sandbox-kit:3 BuildKit frontend)
#   * sandbox-kit/ kit-spec v2 sandbox kit -> ghcr.io/<owner>/infrastructure-sandbox-kit
#                  (`sbx kit push`)
on:
  push:
    branches: [main]
    paths:
      - kit/**
      - sandbox-kit/**
      - scripts/push-kit.sh
      - .github/workflows/publish-kit.yaml
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sbx_release:
        description: "docker/sbx-releases tag to install ('latest' for the newest)"
        required: false
        default: "v0.54.1"
      tag:
        description: "OCI tag to publish"
        required: false
        default: "latest"

permissions:
  contents: read
  packages: write

jobs:
  publish-kit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # sbx is pinned, not "latest", so a release that changes kit handling can't
      # break publishing unnoticed. `sbx kit validate --offline` (v0.49.1+) needs
      # neither a daemon nor an `sbx login`, which this job has neither of.
      - name: Install sbx
        env:
          GH_TOKEN: ${{ github.token }}
          SBX_RELEASE: ${{ inputs.sbx_release || 'v0.54.1' }}
        run: |
          set -euo pipefail
          # NOTE: adjust the asset name if a future sbx release changes it.
          asset='DockerSandboxes-linux-amd64-ubuntu2604.deb'
          if [ "$SBX_RELEASE" = "latest" ]; then
            gh release download --repo docker/sbx-releases --pattern "$asset" --output /tmp/sbx.deb
          else
            gh release download "$SBX_RELEASE" --repo docker/sbx-releases --pattern "$asset" --output /tmp/sbx.deb
          fi
          sudo apt-get update
          sudo apt-get install -y /tmp/sbx.deb
          sbx version

      # A docker-container builder keeps the kit descriptor annotations the v3
      # frontend attaches; the default docker driver can drop them.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push kits (mixin + sandbox)
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || 'latest' }}" bash ./scripts/push-kit.sh
          KIT_DIR=sandbox-kit KIT_NAME=infrastructure-sandbox-kit \
            TAG="${{ inputs.tag || 'latest' }}" bash ./scripts/push-kit.sh
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}" bash ./scripts/push-kit.sh
            KIT_DIR=sandbox-kit KIT_NAME=infrastructure-sandbox-kit \
              TAG="${{ github.ref_name }}" bash ./scripts/push-kit.sh
          fi
