name: Lint scripts

# ShellCheck over the provisioning scripts, using the same pinned release as
# local runs so findings are reproducible (.shellcheckrc carries the config).
on:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .shellcheckrc
      - .github/workflows/lint-scripts.yaml
  pull_request:
    paths:
      - scripts/**
      - .shellcheckrc
      - .github/workflows/lint-scripts.yaml

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    env:
      SHELLCHECK_VERSION: v0.11.0
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned ShellCheck
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ
          sudo install "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh
