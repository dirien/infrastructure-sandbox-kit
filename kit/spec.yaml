schemaVersion: "2"
kind: mixin
name: pulumi
displayName: Pulumi for Claude Code
description: >-
  Turns a Claude Code sandbox into a Pulumi workstation: Pulumi CLI + ESC and the
  language servers for Go/Node/Python (optionally .NET), the Pulumi Cloud token
  wired through the credential proxy, the Pulumi MCP server, and
  dirien/my-claude-apm-setup materialized into the agent home (skills, subagents,
  guardrail hooks, MCP). Layer it onto the built-in `claude` agent, or onto the
  prebuilt template image where the same tools are baked in and this becomes a
  fast no-op.
version: "0.1.0"
sourceURL: https://github.com/dirien/pulumi-sandbox-kit
licenses:
  - MIT

# Claude-specific: this mixin wires Pulumi's token/MCP and the APM Claude config,
# so it only makes sense on the `claude` base agent.
requires:
  agent: claude

permissions:
  network:
    allow:
      # --- Pulumi: service/state API, CLI+plugin downloads, hosted MCP ---
      - api.pulumi.com
      - get.pulumi.com
      - mcp.ai.pulumi.com
      # --- GitHub: Pulumi/ESC binaries, provider plugins, `gh`, APM skill repos ---
      - github.com
      - api.github.com
      - codeload.github.com
      - raw.githubusercontent.com
      - objects.githubusercontent.com
      - release-assets.githubusercontent.com
      # --- Language package registries (your Pulumi program + provisioning) ---
      - registry.npmjs.org
      - pypi.org
      - files.pythonhosted.org
      - proxy.golang.org
      - sum.golang.org
      - storage.googleapis.com
      # --- APM installer + Context7 MCP ---
      - aka.ms
      - context7.com
      - "*.context7.com"
      # --- Optional .NET (uncomment together with PSK_INSTALL_DOTNET=1 below) ---
      # - dot.net
      # - builds.dotnet.microsoft.com
      # - api.nuget.org
      # - "*.nuget.org"
      # --- Your cloud providers go here. Endpoints must be listed explicitly
      #     (only single-label `*.host` wildcards are enforced today) — see
      #     docs/network.md for AWS / Azure / GCP / Civo / Scaleway starters. ---

credentials:
  # Pulumi Cloud access token, injected by the proxy (sentinel-swap): the
  # container only ever sees PULUMI_ACCESS_TOKEN=proxy-managed, and the proxy
  # rewrites the `Authorization: token <PAT>` header on requests to api.pulumi.com.
  # Bind the real value on the host — see docs/credentials.md.
  - service: pulumi
    description: "Pulumi Cloud access token (pulumi login / state backend)"
    apiKey:
      name: PULUMI_ACCESS_TOKEN
      inject:
        - domain: api.pulumi.com
          header: Authorization
          format: "token %s"

environment:
  variables:
    PULUMI_SKIP_UPDATE_CHECK: "true"

setup:
  install:
    # Runs once, synchronously, before Claude launches, as the agent user.
    # Prefers scripts baked into the template image; otherwise fetches them from
    # the kit repo at a pinned ref. The provision step is a fast no-op when the
    # image already provisioned (guarded by a sentinel).
    - user: "1000"
      description: "Install Pulumi + toolchains and wire dirien/my-claude-apm-setup into the agent home"
      command: |
        set -eu
        # --- pins (edit to taste) ---
        export PSK_PULUMI_VERSION="3.255.0"
        export PSK_ESC_VERSION="0.26.0"
        export PSK_APM_SETUP_REPO="dirien/my-claude-apm-setup"
        export PSK_APM_SETUP_REF="v0.4.0"
        export PSK_INSTALL_DOTNET="0"        # set to "1" for Pulumi C#/.NET (also uncomment the .NET domains above)
        KIT_REPO="dirien/pulumi-sandbox-kit"
        KIT_REF="main"                       # pin to a tag or 40-char commit SHA for reproducibility
        # --- locate the provisioning scripts: baked image first, else fetch ---
        DIR="$HOME/.local/share/pulumi-sandbox-kit/scripts"
        if [ ! -f "$DIR/provision.sh" ]; then
          DIR="$(mktemp -d)"
          for s in lib.sh install-pulumi.sh install-toolchains.sh setup-apm-home.sh provision.sh; do
            curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --retry-delay 2 \
              -o "$DIR/$s" "https://raw.githubusercontent.com/$KIT_REPO/$KIT_REF/scripts/$s"
          done
        fi
        bash "$DIR/provision.sh"

agentInstructions:
  content: |
    # Pulumi workstation

    This sandbox is set up for Pulumi infrastructure work.

    - `pulumi` and `esc` are on PATH. `PULUMI_ACCESS_TOKEN` is proxy-managed —
      `pulumi login` against Pulumi Cloud and `pulumi`/`esc` API calls work
      without a token ever being written into the container.
    - Language runtimes: Go, Node.js and Python are ready (plus Java; .NET when
      the kit was built/enabled with .NET). Language servers: gopls,
      typescript-language-server, pyright (and csharp-ls with .NET).
    - MCP: the **pulumi** server (registry lookups, resource-schema and code
      validation, Pulumi Neo) and **context7** (up-to-date library docs) are
      registered at user scope.
    - Skills, subagents and guardrail hooks from `dirien/my-claude-apm-setup` are
      active globally — a PreToolUse guard blocks destructive shell commands and a
      PostToolUse hook scans edits for secrets and formats them.

    Workflow tips:
    - Prefer `pulumi preview` before `pulumi up`. In non-interactive runs use
      `--non-interactive` and explicit `--stack <name>`.
    - New providers download plugins from GitHub/`get.pulumi.com` on first use; if
      a plugin or a cloud endpoint is blocked, add its host to the kit's
      `permissions.network.allow` (see docs/network.md) and recreate the sandbox.
    - Never hardcode cloud or Pulumi credentials in code — the secret scanner will
      block the write. Use Pulumi ESC / stack config / environment.
